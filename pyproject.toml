[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-engine"
version = "1.0.0"
description = "Automated SEO + AdSense-readiness audit and optimization engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "cryptography>=42",
    "advertools>=0.16",
    "aiosqlite>=0.20",
    "arq>=0.26",
    "fastapi>=0.110",
    "google-auth>=2.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "lxml>=5",
    "mem0ai>=2.1",
    "fastembed>=0.7",
    "qdrant-client>=1.15",
    "pydantic>=2.6",
    "PyGithub>=2.3",
    "pydantic-settings>=2.2",
    "pydantic-ai-slim[anthropic,openai,google,groq,mistral,typesafe]>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "textstat>=0.7",
    "trafilatura>=1.12",
    "tree-sitter-language-pack>=0.9",
    "typer>=0.12",
    "alembic>=1.13",
    "sse-starlette>=2.1",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "asgi-lifespan>=2.1"]

[project.scripts]
seo-engine = "seo_engine.cli:app"

[tool.setuptools.packages.find]
include = ["seo_engine*"]

[tool.setuptools.package-data]
seo_engine = ["reports/templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["E501", "E741", "B008", "S101", "S104", "S105", "S311", "S603", "S607", "UP007", "B904", "S110"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"migrations/*" = ["UP"]
